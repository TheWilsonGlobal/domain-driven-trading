<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#020617"/>
  <!-- order book depth: bids (green) left, asks (red) right -->
  <rect x="10" y="38" width="8" height="14" rx="1.5" fill="#10b981" opacity=".55"/>
  <rect x="21" y="30" width="8" height="22" rx="1.5" fill="#10b981" opacity=".8"/>
  <rect x="35" y="24" width="8" height="28" rx="1.5" fill="#f43f5e" opacity=".8"/>
  <rect x="46" y="34" width="8" height="18" rx="1.5" fill="#f43f5e" opacity=".55"/>
  <!-- price line -->
  <polyline points="10,22 22,16 34,19 46,9 54,12" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
