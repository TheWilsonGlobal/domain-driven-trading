services:
  # 1. Redpanda (Kafka compatible high-performance event broker)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: ddt-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. PostgreSQL 16 (Relational Double-Entry Ledger and Trade Audit Store)
  postgres:
    # Stock image. The migrations are mounted into initdb, so there is no build.
    # 002_supabase_init.sql is intentionally NOT mounted: it targets Supabase
    # (service_role policies) and fails on a plain local postgres.
    # Files run in lexical order on first init of an empty data directory.
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: ddt-postgres
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
      - /run/postgresql
    environment:
      POSTGRES_USER: ddt_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: domain_driven_trading
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../internal/infrastructure/persistence/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ../internal/infrastructure/persistence/migrations/003_persistence_recovery.sql:/docker-entrypoint-initdb.d/003_persistence_recovery.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddt_user -d domain_driven_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis 7 (Pre-Trade Idempotency deduplication & Client Order IDs)
  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    container_name: ddt-redis
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Domain-Driven Trading Matching Engine Core
  engine:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: engine
    container_name: ddt-engine
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
      LOG_LEVEL: "info"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Domain-Driven Trading Settlement Worker (PostgreSQL pgx batch writes)
  settlement:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: settlement
    container_name: ddt-settlement
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      DATABASE_URL: "postgres://ddt_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/domain_driven_trading?sslmode=disable"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 6. Domain-Driven Trading API Gateway (REST & WebSocket L2 Market Depth)
  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: gateway
    container_name: ddt-gateway
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      PORT: "${PORT:-5470}"
      KAFKA_BROKERS: "redpanda:9092"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
      DATABASE_URL: "postgres://ddt_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/domain_driven_trading?sslmode=disable"
    ports:
      - "127.0.0.1:${PORT:-5470}:${PORT:-5470}"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  redpanda-data:
  postgres-data:
  redis-data:
