# Domain-Driven Trading Services only (Engine, Gateway, Settlement Worker)
# Connects to external infrastructure:
# - Redpanda (Kafka)
# - PostgreSQL 16
# - Redis 7

services:
  # 1. Matching Engine Core
  engine:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: engine
    container_name: ddt-engine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BROKERS: "${KAFKA_BROKERS:-host.docker.internal:9100}"
      REDIS_ADDR: "${REDIS_ADDR:-host.docker.internal:6379}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    restart: unless-stopped

  # 2. Settlement Worker (PostgreSQL pgx batch writes)
  settlement:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: settlement
    container_name: ddt-settlement
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BROKERS: "${KAFKA_BROKERS:-host.docker.internal:9100}"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:password@host.docker.internal:5432/domain_driven_trading?sslmode=disable}"
    restart: unless-stopped

  # 3. API Gateway (REST & WebSocket L2 Market Depth)
  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: gateway
    container_name: ddt-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "${PORT:-5470}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-host.docker.internal:9100}"
      REDIS_ADDR: "${REDIS_ADDR:-host.docker.internal:6379}"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:password@host.docker.internal:5432/domain_driven_trading?sslmode=disable}"
    ports:
      - "${PORT:-5470}:${PORT:-5470}"
    restart: unless-stopped
