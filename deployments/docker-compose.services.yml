version: '3.8'

# Domain-Driven Trading Services only (Engine, Gateway, Settlement Worker)
# Connects to external infrastructure (Hub / Host):
# - Redpanda (Kafka) at localhost:19092
# - PostgreSQL 16 at localhost:5432
# - Redis 7 at localhost:6379

services:
  # 1. Matching Engine Core
  engine:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: engine
    container_name: ddt-engine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BROKERS: "${KAFKA_BROKERS:-host.docker.internal:19092}"
      REDIS_ADDR: "${REDIS_ADDR:-host.docker.internal:6379}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    restart: unless-stopped

  # 2. Settlement Worker (PostgreSQL pgx batch writes)
  settlement:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: settlement
    container_name: ddt-settlement
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BROKERS: "${KAFKA_BROKERS:-host.docker.internal:19092}"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:password@host.docker.internal:5432/domain_driven_trading?sslmode=disable}"
    restart: unless-stopped

  # 3. API Gateway (REST & WebSocket L2 Market Depth)
  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: gateway
    container_name: ddt-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-host.docker.internal:19092}"
      REDIS_ADDR: "${REDIS_ADDR:-host.docker.internal:6379}"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:password@host.docker.internal:5432/domain_driven_trading?sslmode=disable}"
    ports:
      - "8080:8080"
    restart: unless-stopped
